[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pafpose"
version = "0.1.0"
description = "Part-Aware Fusion Whole-Body 3D Pose Estimator (host CLI)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pafpose = "pafpose.cli:main"

[tool.setuptools.packages.find]
include = ["pafpose*"]
